name: Actualizador EPG

on:
  schedule:
    # Se ejecuta automáticamente cada 12 horas
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions: write-all

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Combinar y filtrar EPGs
      env:
        EPG_URL_PRINCIPAL: ${{ secrets.EPG_URL_PRINCIPAL }}
        EPG_URL_PLUTO: ${{ secrets.EPG_URL_PLUTO }}
        EPG_URL_DMUMA: ${{ secrets.EPG_URL_DMUMA }}
      run: python epg_builder.py

    - name: Guardar cambios en GitHub
      run: |
        git config --global user.name "EPG AutoBot"
        git config --global user.email "bot@github.com"
        git add *.xml
        git commit -m "Auto-actualización de guías EPG por categoría [skip ci]" || exit 0
        git push
